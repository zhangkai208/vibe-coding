<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D 模型预览</title>
  <!-- Cubism 2 运行时 -->
  <script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
  <!-- Cubism 4 运行时 (pixi-live2d-display 需要) -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <!-- PixiJS -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
  <!-- pixi-live2d-display -->
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .model-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .model-card h2 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }
    .model-card p {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }
    canvas {
      display: block;
      border-radius: 8px;
      background: linear-gradient(180deg, #e0e5ec 0%, #f5f7fa 100%);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover {
      background: #5a6fd6;
      transform: translateY(-2px);
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 40px;
    }
  </style>
</head>
<body>
  <h1>Live2D 模型预览</h1>
  <div class="container">
    <div class="model-card">
      <h2>Model 22 (左下角)</h2>
      <p>点击模型触发动作</p>
      <canvas id="canvas22" width="300" height="400"></canvas>
      <div class="controls">
        <button onclick="triggerMotion22('idle')">空闲</button>
        <button onclick="triggerMotion22('tap_body')">点击</button>
        <button onclick="triggerMotion22('thanking')">感谢</button>
      </div>
    </div>
    <div class="model-card">
      <h2>Model 33 (右下角)</h2>
      <p>点击模型触发动作</p>
      <canvas id="canvas33" width="300" height="400"></canvas>
      <div class="controls">
        <button onclick="triggerMotion33('idle')">空闲</button>
        <button onclick="triggerMotion33('tap_body')">点击</button>
        <button onclick="triggerMotion33('thanking')">感谢</button>
      </div>
    </div>
  </div>

  <script>
    // 注册 Live2D
    const { Live2DModel } = PIXI.live2d;

    let model22, model33;
    let app22, app33;

    // 加载模型 22
    async function loadModel22() {
      app22 = new PIXI.Application({
        view: document.getElementById('canvas22'),
        width: 300,
        height: 400,
        backgroundAlpha: 0,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });

      model22 = await Live2DModel.from('src/assets/live2d/model/22/model.default.json');
      app22.stage.addChild(model22);

      // 调整大小和位置
      model22.anchor.set(0.5, 0.5);
      model22.scale.set(0.3);
      model22.x = 150;
      model22.y = 200;

      console.log('Model 22 size:', model22.width, model22.height);

      // 点击交互
      model22.on('hit', (hitAreas) => {
        triggerMotion22('tap_body');
      });
    }

    // 加载模型 33
    async function loadModel33() {
      app33 = new PIXI.Application({
        view: document.getElementById('canvas33'),
        width: 300,
        height: 400,
        backgroundAlpha: 0,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });

      model33 = await Live2DModel.from('src/assets/live2d/model/33/model.default.json');
      app33.stage.addChild(model33);

      // 调整大小和位置
      model33.anchor.set(0.5, 0.5);
      model33.scale.set(0.3);
      model33.x = 150;
      model33.y = 200;

      console.log('Model 33 size:', model33.width, model33.height);

      // 点击交互
      model33.on('hit', (hitAreas) => {
        triggerMotion33('tap_body');
      });
    }

    // 触发动作
    function triggerMotion22(motion) {
      if (model22) model22.motion(motion);
    }

    function triggerMotion33(motion) {
      if (model33) model33.motion(motion);
    }

    // 初始化
    async function init() {
      try {
        await loadModel22();
        console.log('Model 22 加载成功');
      } catch (e) {
        console.error('Model 22 加载失败:', e);
        document.getElementById('canvas22').parentElement.querySelector('p').textContent = '加载失败: ' + e.message;
      }

      try {
        await loadModel33();
        console.log('Model 33 加载成功');
      } catch (e) {
        console.error('Model 33 加载失败:', e);
        document.getElementById('canvas33').parentElement.querySelector('p').textContent = '加载失败: ' + e.message;
      }
    }

    init();
  </script>
</body>
</html>
